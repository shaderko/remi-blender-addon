name: Release check

on:
  pull_request:
  push:
    branches:
      - main
      - model-generation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: addon-release-${{ github.ref }}
  cancel-in-progress: true

env:
  BLENDER_VERSION: "5.3.0"
  BLENDER_REVISION: "02f0899d78e3"

jobs:
  blender:
    name: macOS arm64 / Blender 5.3.0
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          path: remi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install native build tools
        run: python -m pip install pybind11==3.0.1 PyYAML==6.0.3 numpy==2.4.6 scipy==1.18.1 numba==0.68.1 Pillow==12.2.0

      - name: Build native modules
        working-directory: remi
        run: python scripts/release.py native

      - name: Cache release wheels
        uses: actions/cache@v4
        with:
          path: remi/wheels/*.whl
          key: remi-wheels-pymeshlab-2025.7.post1-cp313-macos-arm64

      - name: Cache Blender download
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/blender-${{ env.BLENDER_VERSION }}-macos-arm64.dmg
          key: blender-${{ env.BLENDER_VERSION }}-${{ env.BLENDER_REVISION }}-9e9c56429e04-macos-arm64

      - name: Download Blender
        run: |
          blender_dmg="$RUNNER_TEMP/blender-${{ env.BLENDER_VERSION }}-macos-arm64.dmg"
          if [[ ! -f "$blender_dmg" ]]; then
            curl --fail --location --retry 3 \
              "https://cdn.builder.blender.org/download/daily/blender-5.3.0-stable+v53.02f0899d78e3-darwin.arm64-release.dmg" \
              --output "$blender_dmg"
          fi
          echo "9e9c56429e045cfb98f556378cda144c8085517b2accc1954c279c2cc7ffd331  $blender_dmg" | shasum -a 256 -c -

      - name: Mount Blender
        run: |
          blender_dmg="$RUNNER_TEMP/blender-${{ env.BLENDER_VERSION }}-macos-arm64.dmg"
          blender_app="$RUNNER_TEMP/Blender-${{ env.BLENDER_VERSION }}.app"
          mount_point="$RUNNER_TEMP/blender-mount-${{ env.BLENDER_VERSION }}"
          mkdir -p "$mount_point"
          hdiutil attach "$blender_dmg" -nobrowse -readonly -mountpoint "$mount_point"
          cp -R "$mount_point/Blender.app" "$blender_app"
          hdiutil detach "$mount_point"
          echo "BLENDER_BIN=$blender_app/Contents/MacOS/Blender" >> "$GITHUB_ENV"

      - name: Test and validate extension
        run: |
          python remi/scripts/release.py check --blender "$BLENDER_BIN" --output-dir "$RUNNER_TEMP/dist"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: remi-macos-arm64
          path: ${{ runner.temp }}/dist/remi-*-macos-arm64.zip
          if-no-files-found: error

  windows:
    name: Windows x64 / Blender 5.3.0
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          path: remi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          architecture: x64

      - name: Install native build tools
        run: python -m pip install pybind11==3.0.1 PyYAML==6.0.3 numpy==2.4.6 scipy==1.18.1 numba==0.68.1 Pillow==12.2.0

      - name: Build native modules
        working-directory: remi
        run: python scripts/release.py native

      - name: Cache release wheels
        uses: actions/cache@v4
        with:
          path: remi/wheels/*.whl
          key: remi-wheels-pymeshlab-2025.7.post1-cp313-windows-x64

      - name: Cache Blender download
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/blender-${{ env.BLENDER_VERSION }}-windows-x64.zip
          key: blender-${{ env.BLENDER_VERSION }}-${{ env.BLENDER_REVISION }}-f06bc85afb22-windows-x64

      - name: Download and extract Blender
        shell: pwsh
        run: |
          $archive = "$env:RUNNER_TEMP/blender-${{ env.BLENDER_VERSION }}-windows-x64.zip"
          if (!(Test-Path $archive)) {
            curl.exe --fail --location --retry 3 "https://cdn.builder.blender.org/download/daily/blender-5.3.0-stable+v53.02f0899d78e3-windows.amd64-release.zip" --output $archive
            if ($LASTEXITCODE -ne 0) { throw "Blender download failed" }
          }
          if ((Get-FileHash -Algorithm SHA256 $archive).Hash.ToLower() -ne "f06bc85afb22df30f4a828f1074f668de4936fb3a3cbc876b1144948d6e2e6ed") {
            throw "Pinned Blender archive checksum mismatch"
          }
          Expand-Archive -Path $archive -DestinationPath "$env:RUNNER_TEMP/blender"
          $blender = Get-ChildItem "$env:RUNNER_TEMP/blender" -Recurse -Filter blender.exe
          if ($blender.Count -ne 1) { throw "Expected exactly one Blender executable" }
          "BLENDER_BIN=$($blender.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Test and validate extension
        run: python remi/scripts/release.py check --blender "$env:BLENDER_BIN" --output-dir "$env:RUNNER_TEMP/dist"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: remi-windows-x64
          path: ${{ runner.temp }}/dist/remi-*-windows-x64.zip
          if-no-files-found: error
