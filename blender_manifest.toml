schema_version = "1.0.0"

id = "remi"
version = "2.0.0-beta.2"
name = "Remi"
tagline = "Repair, optimize, retopologize, and bake difficult meshes"
maintainer = "Remi"
type = "add-on"

website = "https://github.com/shaderko/remi-blender-addon"

blender_version_min = "5.1.0"

license = [
  "SPDX:GPL-3.0-or-later",
]

copyright = [
  "2020 Visual Computing Lab, ISTI - Italian National Research Council",
  "2018-2020 Jonathan Young",
  "2015 Wenzel Jakob, Daniele Panozzo, Marco Tarini, Olga Sorkine-Hornung",
]

# The bundled native Instant Meshes and xatlas modules currently target
# CPython 3.13 on macOS Apple Silicon.
platforms = ["macos-arm64"]

wheels = [
  "./wheels/pymeshlab-2025.7.post1-cp313-cp313-macosx_11_0_arm64.whl",
]

[permissions]
files = "Import, export, compile, and process mesh and texture files"

[build]
paths_exclude_pattern = [
  "__pycache__/",
  ".*",
  "*.zip",
  "/dist/",
  "/scripts/",
  "/tests/",
  "/weppy-project-sync/",
  "/features/retopology/instant_meshes/native/",
  "/features/uv/engine/native/",
]
